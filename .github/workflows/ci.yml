name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Schemas up to date
        run: npm run schemas && git diff --exit-code schema
      - run: npm test
